name: release

# Publishing a GitHub release uploads that version to PyPI, using PyPI trusted
# publishing (no API token). One-time setup on pypi.org, by a project owner:
# Manage project -> Publishing -> add a GitHub publisher with
#   owner: century-arcade, repository: xdformat,
#   workflow: release.yml, environment: pypi
# and create an environment named "pypi" in this repo's settings.
#
# Bump __version__ in xdformat/__init__.py before tagging the release.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: check that the tag matches the package version
        run: |
          version=$(python -c "import xdformat; print(xdformat.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xdformat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
